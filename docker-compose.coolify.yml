# Despliegue en Coolify (servidor pablo-h310).
#
# Difiere de docker-compose.yml en tres puntos, y por eso es un archivo aparte:
#   - No levanta PostgreSQL: la base es un recurso propio de Coolify y se alcanza
#     por su hostname interno de Docker.
#   - No levanta NGINX: el proxy de borde de Coolify (Traefik) termina TLS y rutea.
#   - No usa `env_file`: en Coolify las variables se cargan desde la UI del
#     proyecto, que es tambien donde viven los secretos.
#
# Requisito previo en la UI de Coolify, en ESTE recurso y en el de PostgreSQL:
#   activar "Connect To Predefined Network". Sin eso cada recurso queda en su
#   propia red y el hostname interno de la base no resuelve desde la API.
#
# Las migraciones corren como un servicio de un solo disparo que debe terminar
# bien antes de que arranque la API. Es reejecutable: Umzug omite las
# migraciones ya aplicadas, asi que un redespliegue no las repite.
#
# Este despliegue es de DESARROLLO (NODE_ENV=development). Bajo ese valor el
# esquema no aplica las compuertas de produccion: AUTH_MODE=disabled es valido,
# Swagger puede quedar expuesto y las metricas no exigen token de scrape.
# Ojo: la base a la que apunta contiene el conjunto de datos real, asi que con
# AUTH_MODE=disabled queda accesible sin credencial.

services:
  migrate:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/database/cli/migrate.js']
    environment:
      # Lo manda la UI de Coolify; en desarrollo el validador no aplica las
      # compuertas que tumbaron el despliegue anterior.
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:?requerida}
      DATABASE_WRITER_URL: ${DATABASE_WRITER_URL:?requerida}
      DATABASE_READER_URL: ${DATABASE_READER_URL:?requerida}
      # Fijo, no heredado de la UI: el Postgres destino corre con `ssl = off` y
      # rechaza el handshake ("server does not support SSL, but SSL was
      # required"). Es trafico interno de Docker, que no sale del host.
      DATABASE_SSL: 'false'
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      # El migrador no atiende HTTP, pero valida el mismo esquema al arrancar.
      # `disabled` solo es admisible porque este entorno no es produccion.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      # Los secretos de autenticación no se declaran aquí a propósito. Escribirlos
      # como `${VAR:-}` no los deja sin definir: los inyecta como cadena vacía, y
      # el esquema rechaza "" por longitud mínima aunque el campo sea opcional.
      # Se cargan desde la UI de Coolify, que ya inyecta sus variables al contenedor.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_ENABLED: 'false'
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [coolify]
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Coolify sustituye esta variable por el dominio asignado y genera las
      # etiquetas de Traefik hacia el puerto 3000. Hoy asigna un
      # `*.localhost.sslip.io` que no resuelve, asi que el acceso real va por el
      # puerto publicado mas abajo; queda declarada para cuando haya dominio.
      SERVICE_FQDN_API_3000:
      NODE_ENV: ${NODE_ENV:-development}
      # Debe escuchar en todas las interfaces: el proxy entra por la red Docker,
      # no por loopback.
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_NAME: ${APP_NAME:-observatorio-economico-core}
      API_PREFIX: ${API_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      # Vacio es valido para el esquema (default ''), asi que no bloquea el
      # arranque; sin el, el tablero no podra llamar a la API desde el navegador.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Traefik es el par directo y agrega X-Forwarded-For; sin esto el limitador
      # de tasa veria una sola IP, la del proxy, para todo el trafico.
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_AGENT_MAX: ${RATE_LIMIT_AGENT_MAX:-1200}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      HTTP_CONNECTION_TIMEOUT_MS: ${HTTP_CONNECTION_TIMEOUT_MS:-10000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-72000}

      DATABASE_WRITER_URL: ${DATABASE_WRITER_URL:?requerida}
      DATABASE_READER_URL: ${DATABASE_READER_URL:?requerida}
      DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:?requerida}
      # Ver la nota del servicio migrate: el destino no soporta TLS.
      DATABASE_SSL: 'false'
      # Las migraciones ya corrieron en el servicio anterior; repetirlas aqui
      # haria que dos replicas compitieran por el mismo bloqueo al arrancar.
      DATABASE_PROVISION_ON_BOOT: 'false'
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_POOL_MAX_WRITER: ${DATABASE_POOL_MAX_WRITER:-15}
      DATABASE_POOL_MAX_READER: ${DATABASE_POOL_MAX_READER:-30}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-0}
      DATABASE_POOL_ACQUIRE_MS: ${DATABASE_POOL_ACQUIRE_MS:-15000}
      DATABASE_POOL_IDLE_MS: ${DATABASE_POOL_IDLE_MS:-10000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}

      AUTH_MODE: ${AUTH_MODE:-disabled}
      # Los secretos de autenticación no se declaran aquí a propósito. Escribirlos
      # como `${VAR:-}` no los deja sin definir: los inyecta como cadena vacía, y
      # el esquema rechaza "" por longitud mínima aunque el campo sea opcional.
      # Se cargan desde la UI de Coolify, que ya inyecta sus variables al contenedor.
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-roles}
      AUTH_ORGANIZATION_CLAIM: ${AUTH_ORGANIZATION_CLAIM:-organization_id}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Fijas en false a propósito: si este despliegue pasara algún día a
      # NODE_ENV=production, el validador exigiría METRICS_SCRAPE_TOKEN junto a
      # METRICS_ENABLED=true y el arranque caería. Para activarlas, define ese
      # token (>=24 caracteres) en Coolify y cambia esta línea.
      METRICS_ENABLED: 'false'

      # El respaldo lo dispara un programador externo, nunca el proceso de la API.
      BACKUP_ENABLED: 'false'

      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-observatorio-economico-api}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
    expose: ['3000']
    # Publicado unicamente sobre la interfaz de Tailscale. Con AUTH_MODE=disabled
    # y el conjunto de datos real detras, abrirlo en 0.0.0.0 lo dejaria accesible
    # a cualquiera que alcance el host. El 3000 del servidor ya esta tomado por
    # otro proceso, de ahi el 3002.
    ports:
      - '${API_PUBLISH_ADDRESS:-100.101.207.88}:${API_PUBLISH_PORT:-3002}:3000'
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks: [coolify]
    restart: unless-stopped

# Red compartida que crea Coolify. Es la que permite que la API resuelva el
# hostname interno de la base; debe existir antes del despliegue.
networks:
  coolify:
    external: true

# OpenTelemetry Collector — staging and production.
#
# The Collector is the control point between the application and the tracing
# backend: it absorbs bursts, applies the last redaction barrier and lets Jaeger
# restart without the API noticing. Local development exports straight to Jaeger
# and does not use this file (ADR-0015, docs/observability/01-architecture-design.md §2).
#
# Validate a change before deploying it:
#   docker run --rm -v "$PWD/infra/otel-collector:/etc/otelcol" \
#     otel/opentelemetry-collector-contrib:0.145.0 validate --config=/etc/otelcol/otel-collector.config.yml

receivers:
  otlp:
    protocols:
      http:
        # Bound to the private network only; never exposed to the internet.
        endpoint: 0.0.0.0:4318
        # A single API replica sends batches of a few hundred kilobytes.
        max_request_body_size: 4194304
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # First in the chain on purpose: it must be able to reject data before any
  # other processor allocates memory for it.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Last redaction barrier. The application already avoids capturing these, so a
  # value arriving here means an instrumentation started reporting something new.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: update
        value: '<redacted>'
      - key: db.query.parameter
        action: delete

  # Infrastructure probes are already excluded at the source; this catches a
  # replica deployed with an outdated exclusion list.
  filter/probes:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/ready"'
        - 'attributes["http.route"] == "/metrics"'

  # Declares where the telemetry itself comes from, which is what lets an
  # operator tell staging traces from production traces in one backend.
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/jaeger:
    endpoint: ${env:JAEGER_COLLECTOR_ENDPOINT}
    tls:
      insecure: false
    # A Jaeger restart must cost queued spans, never backpressure that reaches
    # the API. The queue is bounded and drops on overflow by design.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/probes
        - attributes/redact
        - resource/environment
        - batch
      exporters: [otlp/jaeger]
  telemetry:
    logs:
      level: warn
    metrics:
      # Scraped by the same Prometheus that scrapes the API.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

name: daily-source-batches

# The sources that need no model, collected in separate batches.
#
# The research collector calls a language model and lives under its rate limit,
# which is what made every early run fail. None of these do: they read a feed, a
# public exchange endpoint or a central-bank page and write a seed file. Putting
# them in the same job as the model call would make a rate limit on the model
# lose the day's markets too, so they run apart from it and apart from each
# other — a batch that fails costs its own sources and nothing else.
#
# Staggered off the research collector's times (10:30, 16:30, 22:30 UTC) so the
# two never contend, and spread across the day so a source that publishes in the
# afternoon is not read only at dawn.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Which batch to run
        required: false
        default: todas
        type: choice
        options: [todas, mercados, bcb, prensa]
  schedule:
    # America/La_Paz is UTC-4 year-round: 07:10, 13:10 and 19:10 local.
    - cron: '10 11,17,23 * * *'

permissions:
  contents: read

concurrency:
  group: daily-source-batches
  cancel-in-progress: false

jobs:
  # Cheapest first, and the one whose data moves fastest.
  mercados:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","mercados"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect market closes
        run: yarn markets:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-prices-${{ github.run_id }}
          path: src/database/seeds/boot/market-prices.json
          retention-days: 14

  bcb:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","bcb"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the central bank's quotations
        run: yarn bcb:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcb-quotes-${{ github.run_id }}
          path: src/database/seeds/boot/bcb-quotes.json
          retention-days: 14

  # Last and longest: two of the seven outlets need a browser, which is why this
  # batch alone installs one. See ADR-0019.
  prensa:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","prensa"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Install the browser the rendered sections need
        run: npx playwright install --with-deps chromium
      - name: Collect press coverage
        run: yarn press:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: press-coverage-${{ github.run_id }}
          path: src/database/seeds/boot/press-coverage.json
          retention-days: 14

  # El paso que faltaba para que un dato recogido llegue a leerse.
  #
  # Los tres lotes de arriba escriben su fichero semilla y hasta hoy lo subian
  # como artefacto del run y nada mas: el dato quedaba dentro de un zip de
  # GitHub, no entraba en el repositorio y no llegaba nunca a la base que lee el
  # tablero. Dos dias enteros de mercados, cotizaciones y prensa se perdieron
  # asi, con los tres lotes en verde y sin una sola linea roja que lo dijera.
  #
  # El circuito es semilla -> repositorio -> despliegue -> siembra -> base. Este
  # trabajo cierra el primer salto: recoge las semillas de los lotes que hayan
  # salido bien y las comitea juntas, un commit y un push por ejecucion en vez
  # de tres carreras por la misma rama.
  #
  # Y luego pide el despliegue a mano, que no es un adorno: un push hecho con
  # GITHUB_TOKEN no dispara otros workflows —GitHub lo impide para que uno no se
  # llame a si mismo sin fin— asi que sin esta llamada el commit se quedaria en
  # el repositorio sin llegar jamas al servidor, que es la misma clase de final
  # silencioso que este trabajo viene a corregir.
  publicar:
    needs: [mercados, bcb, prensa]
    # Un lote caido cuesta sus fuentes y no las de los otros dos, igual que
    # arriba. `always()` publicaria tambien lo cancelado a mano.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.mercados.result == 'success'
        with:
          name: market-prices-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.bcb.result == 'success'
        with:
          name: bcb-quotes-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.prensa.result == 'success'
        with:
          name: press-coverage-${{ github.run_id }}
          path: src/database/seeds/boot
      - name: Commit the readings that came back
        run: |
          set -euo pipefail
          git config user.name 'observatorio-recolector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/database/seeds/boot/market-prices.json                   src/database/seeds/boot/bcb-quotes.json                   src/database/seeds/boot/press-coverage.json
          # Una fuente que no publico nada hoy deja su semilla igual que ayer, y
          # eso no es un fallo: es un dia sin novedades. Un commit vacio si lo
          # seria, porque desplegaria por nada.
          if git diff --cached --quiet; then
            echo 'ninguna semilla cambio: no hay nada que publicar'
            echo 'publicado=no' >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Publicar las lecturas del dia'                      -m "Recogidas por la ejecucion ${{ github.run_id }} de daily-source-batches."                      -m 'Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>'
          # El lote de prensa tarda veinte minutos mas que los otros, asi que
          # otro push puede haber entrado en `dev` mientras tanto. Reintegrar y
          # reintentar, en vez de forzar sobre lo que llego antes.
          for intento in 1 2 3; do
            if git push origin HEAD:dev; then
              echo 'publicado=si' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "push rechazado (intento $intento): reintegrando sobre dev"
            git pull --rebase origin dev
          done
          echo 'no se pudo publicar tras tres intentos' >&2
          exit 1
      - name: Ask for the deploy this push cannot trigger
        if: env.publicado == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref dev

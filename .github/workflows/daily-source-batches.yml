name: daily-source-batches

# The sources that need no model, collected in separate batches.
#
# The research collector calls a language model and lives under its rate limit,
# which is what made every early run fail. None of these do: they read a feed, a
# public exchange endpoint or a central-bank page and write a seed file. Putting
# them in the same job as the model call would make a rate limit on the model
# lose the day's markets too, so they run apart from it and apart from each
# other — a batch that fails costs its own sources and nothing else.
#
# Staggered off the research collector's times (10:30, 16:30, 22:30 UTC) so the
# two never contend, and spread across the day so a source that publishes in the
# afternoon is not read only at dawn.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Which batch to run
        required: false
        default: todas
        type: choice
        options: [todas, mercados, bcb, dolar, fichas, exogenas, factores, aduana, bancos, bcb-estadisticas, prensa, abi]
  schedule:
    # America/La_Paz is UTC-4 year-round: 07:10, 13:10 and 19:10 local.
    - cron: '10 11,17,23 * * *'

permissions:
  contents: read

concurrency:
  group: daily-source-batches
  cancel-in-progress: false

jobs:
  # Cheapest first, and the one whose data moves fastest.
  mercados:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","mercados"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect market closes
        run: yarn markets:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-prices-${{ github.run_id }}
          path: src/database/seeds/boot/market-prices.json
          retention-days: 14

  bcb:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","bcb"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the central bank's quotations
        run: yarn bcb:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcb-quotes-${{ github.run_id }}
          path: src/database/seeds/boot/bcb-quotes.json
          retention-days: 14

  # El dolar oficial y el paralelo solo llegaban por la API del recolector, que
  # escribe en la base de un servidor: Contabo se quedo con el dolar del 20 de
  # septiembre de 2026 mientras el oficial pasaba de 11,00 a 12,26. Como semilla
  # llega a las dos bases. Falla si la fuente deja de publicar mas de tres dias.
  dolar:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","dolar"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fusiona con la semilla que encuentra: tiene que ser la de `dev`.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the official and parallel dollar
        run: yarn fx:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fx-daily-${{ github.run_id }}
          path: src/database/seeds/boot/fx-daily.json
          retention-days: 14

  # El boliviano frente a otras 22 monedas, de la tabla de cotizaciones del BCB.
  # Una semilla por moneda: llega a las dos bases como el dolar. Un lote aparte
  # para que una tabla ilegible no frene la semilla del dolar. Falla si el BCB
  # deja de publicar mas de cinco dias.
  monedas:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","dolar"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Solo anade dias nuevos a lo que encuentra: tiene que ser `dev`.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the boliviano against other currencies
        run: yarn fx:currencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exogenous-currencies-${{ github.run_id }}
          path: src/database/seeds/boot/exogenous-currencies
          retention-days: 14

  # El unico lote que existe para que un dato llegue a DOS bases.
  #
  # Las lecturas por ficha estable ya las recoge el colector de investigacion y
  # las publica por la API, pero esa API es la de un servidor. El segundo
  # despliegue mostraba el panel del riel sin la ficha que le faltaba, con el
  # colector en verde y sin una sola linea roja que lo dijera. Una semilla viaja
  # en el repositorio y entra al arrancar, asi que la tiene cualquier base.
  #
  # Duplica a proposito la via de la API: las dos fallan por motivos distintos y
  # ninguna base deberia depender de una sola.
  fichas:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","fichas"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Como el lote del BCB y por lo mismo: la semilla se fusiona con la
          # que haya, y fusionar contra la de otra rama perderia lo que solo
          # estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the boliviano books of every stablecoin
        run: yarn stablecoins:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stablecoin-books-${{ github.run_id }}
          path: src/database/seeds/boot/stablecoin-books.json
          retention-days: 14

  # Los precios que Bolivia no fija: Banco Mundial, FRED y FAO/GIEWS.
  #
  # Publican una vez al mes, y el colector solo reescribe la semilla si alguna
  # cifra cambio: en las otras ochenta y nueve corridas del mes el archivo sale
  # igual y el paso de publicar no encuentra nada que comitear. El valor por
  # kilo de aduana (`yarn exogenous:customs`) no va aqui: es anual y se corre a
  # mano cuando Comtrade cierra un año.
  exogenas:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","exogenas"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La semilla se compara con la que haya para no reescribirla por nada;
          # compararla con la de otra rama la reescribiria siempre.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the prices Bolivia does not set
        run: yarn exogenous:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exogenous-prices-${{ github.run_id }}
          path: |
            src/database/seeds/boot/exogenous-prices.json
            src/database/seeds/boot/exogenous-freight-weeks.json
          retention-days: 14

  # Series de factores con licencia y disponibilidad temporal verificables.
  factores:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","factores"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Test factor contracts, revisions and parsers
        run: yarn test:exogenous
      - name: Collect versioned economic factors
        id: collect
        continue-on-error: true
        run: yarn exogenous:factors
      - name: Validate last good and new series
        id: validate
        run: yarn db:seed:validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exogenous-factors-${{ github.run_id }}
          path: src/database/seeds/boot/exogenous-factors.json
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exogenous-factor-evidence-${{ github.run_id }}
          path: artifacts/exogenous-factors
          retention-days: 90
      - name: Report partial source failure
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Some factor sources failed. Valid previous series were retained; inspect the source status artifact.'

  # La base de comercio exterior del INE, declaracion por declaracion.
  #
  # El INE la republica una vez al mes (el año en curso, y a veces revisa el
  # anterior) y cada republicacion cambia el enlace compartido del año. El
  # colector compara enlace y huella con los que ya cita cada semilla y no
  # reescribe nada si el INE no publico: casi todas las corridas no bajan un
  # solo cuaderno, y entonces tampoco hay artefacto que subir ni que publicar.
  aduana:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","aduana"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Las semillas de `dev` son contra las que se compara lo que el INE publica.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Collect the statistics institute's customs register
        run: yarn trade-records:collect
      - name: Keep only the years that changed
        id: changed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ine-trade"
          git status --porcelain --untracked-files=all -- src/database/seeds/boot/ine-trade \
            | awk '{print $2}' \
            | while read -r file; do cp "$file" "$RUNNER_TEMP/ine-trade/"; done
          echo "count=$(ls "$RUNNER_TEMP/ine-trade" | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changed.outputs.count != '0'
        with:
          name: ine-trade-${{ github.run_id }}
          path: ${{ runner.temp }}/ine-trade
          retention-days: 14

  # Los bancos que ofrecen dolar digital (USDT, USDC) a sus clientes.
  #
  # Ningun banco publica su cotizacion fuera de la aplicacion, asi que no hay
  # precio que recoger: se lee si la pagina oficial de cada uno sigue anunciando
  # el servicio y que limites declara, una lectura por dia. Una pagina que no
  # responde no escribe nada, y solo si no responde ninguna el lote falla.
  bancos:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","bancos"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La semilla se fusiona con la que haya: fusionarla contra la de otra
          # rama perderia los dias que solo estuvieran en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Read the banks' virtual-dollar services
        run: yarn banks:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bank-virtual-assets-${{ github.run_id }}
          path: src/database/seeds/boot/bank-virtual-assets.json
          retention-days: 14

  # Las estadisticas que el Banco Central publica en cuadernos de Excel: reservas,
  # dinero, precios, tasas, sector externo y sistema de pagos, serie por serie.
  #
  # Son unos doscientos treinta informes y el sitio es lento, pero el lote no baja lo
  # que no cambio: pregunta con If-None-Match y reutiliza las series ya sembradas de
  # cada cuaderno que el sitio dice igual. Solo la primera corrida baja todo. El
  # estado (las huellas de cada cuaderno) viaja en el repositorio junto a las semillas.
  # Python y no node porque el lector de hojas ya esta probado ahi y entiende las
  # fechas de Excel y los .xls antiguos.
  bcb-estadisticas:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","bcb-estadisticas"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fusiona con las semillas y el estado que haya: leerlos de otra rama
          # perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the workbook readers
        run: python -m pip install --quiet openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.19.0
      - name: Read the central bank's workbooks
        run: python scripts/bcb/harvest/collect.py
      # Las subastas salen de los PDF semanales «O&M»: solo baja los informes que aun
      # no tiene guardados, asi que fuera de la semana de publicacion no baja nada.
      - name: Read the auction reports
        run: python scripts/bcb/harvest/collect_omas.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcb-statistics-${{ github.run_id }}
          path: src/database/seeds/boot/bcb-statistics
          retention-days: 14

  # Last and longest: two of the seven outlets need a browser, which is why this
  # batch alone installs one. See ADR-0019.
  abi:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","abi"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test:abi
      - name: Collect ABI publications and revisions
        run: yarn press:abi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: abi-news-${{ github.run_id }}
          path: src/database/seeds/boot/abi-news
          retention-days: 14

  prensa:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["todas","prensa"]'), inputs.batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dev` es la rama que se despliega, y por tanto la unica cuyas
          # semillas importan. El cron arranca siempre desde la rama por
          # defecto y eso no se puede cambiar, pero lo que se lee si: el lote
          # del BCB fusiona con la semilla que encuentra, y fusionar contra la
          # de otra rama perderia lo que solo estuviera en esta.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Install the browser the rendered sections need
        run: npx playwright install --with-deps chromium
      - name: Collect press coverage
        run: yarn press:collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: press-coverage-${{ github.run_id }}
          path: src/database/seeds/boot/press-coverage.json
          retention-days: 14

  # El paso que faltaba para que un dato recogido llegue a leerse.
  #
  # Los tres lotes de arriba escriben su fichero semilla y hasta hoy lo subian
  # como artefacto del run y nada mas: el dato quedaba dentro de un zip de
  # GitHub, no entraba en el repositorio y no llegaba nunca a la base que lee el
  # tablero. Dos dias enteros de mercados, cotizaciones y prensa se perdieron
  # asi, con los tres lotes en verde y sin una sola linea roja que lo dijera.
  #
  # El circuito es semilla -> repositorio -> despliegue -> siembra -> base. Este
  # trabajo cierra el primer salto: recoge las semillas de los lotes que hayan
  # salido bien y las comitea juntas, un commit y un push por ejecucion en vez
  # de tres carreras por la misma rama.
  #
  # Y luego pide el despliegue a mano, que no es un adorno: un push hecho con
  # GITHUB_TOKEN no dispara otros workflows —GitHub lo impide para que uno no se
  # llame a si mismo sin fin— asi que sin esta llamada el commit se quedaria en
  # el repositorio sin llegar jamas al servidor, que es la misma clase de final
  # silencioso que este trabajo viene a corregir.
  publicar:
    needs: [mercados, bcb, dolar, monedas, fichas, exogenas, factores, aduana, bancos, bcb-estadisticas, prensa, abi]
    # Un lote caido cuesta sus fuentes y no las de los otros dos, igual que
    # arriba. `always()` publicaria tambien lo cancelado a mano.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      # Un lote caido no para a los demas, y por eso mismo nadie lo ve: la
      # corrida publica lo que volvio y el lote que falto se queda con la semilla
      # de ayer. Se deja constancia en el issue `ingesta-caida`.
      - name: Report the batches that failed
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: >-
            ${{ needs.mercados.result == 'failure' && 'mercados ' || '' }}${{ needs.bcb.result == 'failure' && 'bcb ' || '' }}${{ needs.dolar.result == 'failure' && 'dolar ' || '' }}${{ needs.monedas.result == 'failure' && 'monedas ' || '' }}${{ needs.fichas.result == 'failure' && 'fichas ' || '' }}${{ needs.exogenas.result == 'failure' && 'exogenas ' || '' }}${{ needs.factores.result == 'failure' && 'factores ' || '' }}${{ needs.aduana.result == 'failure' && 'aduana ' || '' }}${{ needs.bancos.result == 'failure' && 'bancos ' || '' }}${{ needs['bcb-estadisticas'].result == 'failure' && 'bcb-estadisticas ' || '' }}${{ needs.prensa.result == 'failure' && 'prensa' || '' }}
        run: bash scripts/ops/avisar-ingesta-caida.sh "daily-source-batches, lotes caidos $FAILED"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.mercados.result == 'success'
        with:
          name: market-prices-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.bcb.result == 'success'
        with:
          name: bcb-quotes-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.dolar.result == 'success'
        with:
          name: fx-daily-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.monedas.result == 'success'
        with:
          name: exogenous-currencies-${{ github.run_id }}
          path: src/database/seeds/boot/exogenous-currencies
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.fichas.result == 'success'
        with:
          name: stablecoin-books-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.exogenas.result == 'success'
        with:
          name: exogenous-prices-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.factores.result == 'success'
        with:
          name: exogenous-factors-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.aduana.result == 'success' && needs.aduana.outputs.changed != '0'
        with:
          name: ine-trade-${{ github.run_id }}
          path: src/database/seeds/boot/ine-trade
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.bancos.result == 'success'
        with:
          name: bank-virtual-assets-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs['bcb-estadisticas'].result == 'success'
        with:
          name: bcb-statistics-${{ github.run_id }}
          path: src/database/seeds/boot/bcb-statistics
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.prensa.result == 'success'
        with:
          name: press-coverage-${{ github.run_id }}
          path: src/database/seeds/boot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: needs.abi.result == 'success'
        with:
          name: abi-news-${{ github.run_id }}
          path: src/database/seeds/boot/abi-news
      - name: Report ABI collection failure
        if: needs.abi.result == 'failure'
        run: echo '::warning::ABI collection failed; the last committed corpus is retained.'
      - name: Commit the readings that came back
        run: |
          set -euo pipefail
          git config user.name 'observatorio-recolector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/database/seeds/boot/exogenous-factors.json
          git add src/database/seeds/boot/abi-news
          git add src/database/seeds/boot/market-prices.json                   src/database/seeds/boot/bcb-quotes.json                   src/database/seeds/boot/fx-daily.json                   src/database/seeds/boot/stablecoin-books.json                   src/database/seeds/boot/exogenous-prices.json                   src/database/seeds/boot/exogenous-freight-weeks.json                   src/database/seeds/boot/exogenous-currencies                   src/database/seeds/boot/bank-virtual-assets.json                   src/database/seeds/boot/bcb-statistics                   src/database/seeds/boot/press-coverage.json                   src/database/seeds/boot/ine-trade
          # Una fuente que no publico nada hoy deja su semilla igual que ayer, y
          # eso no es un fallo: es un dia sin novedades. Un commit vacio si lo
          # seria, porque desplegaria por nada.
          if git diff --cached --quiet; then
            echo 'ninguna semilla cambio: no hay nada que publicar'
            echo 'publicado=no' >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Publicar las lecturas del dia'                      -m "Recogidas por la ejecucion ${{ github.run_id }} de daily-source-batches."                      -m 'Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>'
          # El lote de prensa tarda veinte minutos mas que los otros, asi que
          # otro push puede haber entrado en `dev` mientras tanto. Reintegrar y
          # reintentar, en vez de forzar sobre lo que llego antes.
          for intento in 1 2 3; do
            if git push origin HEAD:dev; then
              echo 'publicado=si' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "push rechazado (intento $intento): reintegrando sobre dev"
            git pull --rebase origin dev
          done
          echo 'no se pudo publicar tras tres intentos' >&2
          exit 1
      - name: Ask for the deploy this push cannot trigger
        if: env.publicado == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref dev

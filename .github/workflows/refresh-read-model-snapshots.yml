name: refresh-read-model-snapshots

# Llena las copias guardadas que la migracion 0072 crea vacias.
#
# Por que existe. Cuatro modelos del observatorio rearman sus cifras desde la
# evidencia de cada declaracion — el registro de fuentes, la macro anual, los
# hechos relevantes y el catalogo del panel mundial — y contra el corpus actual
# ninguno termina dentro del plazo que tiene una consulta normal. La 0072 guarda
# su salida, y la crea VACIA a proposito: construirla dentro de la migracion
# pondria minutos de ordenacion entre un despliegue y una API que pueda
# arrancar, en un servidor que ya devolvio «disk full» por una de estas
# consultas. Este workflow es la otra mitad, y falla solo, sin llevarse el
# nucleo por delante.
#
# Que hace. Entra a la tailnet y pide a Coolify que ejecute, dentro del
# contenedor de la API, el CLI compilado que reconstruye las cuatro copias.
# Ninguna credencial entra ni sale de este archivo.
#
# Corre despues de `deploy-to-coolify`, no antes: la copia solo existe cuando la
# migracion que la crea ya paso, y reconstruirla sobre una vista vieja la deja
# igual de vieja.
#
# Se dispara a mano. Correrla de mas no hace dano: rehacerlas es idempotente,
# solo cuesta los minutos que tardan.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-read-model-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          args: --ssh=false

      - name: Rebuild the stored copies of the expensive read models
        env:
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          set -u

          api() {
            curl --silent --show-error --max-time 1500 \
                 --header "Authorization: Bearer $TOKEN" \
                 --header "Accept: application/json" \
                 "$@"
          }

          unwrap='if type == "array" then . elif type == "object" and (.data | type) == "array" then .data else empty end'

          list=$(api "http://100.101.207.88/api/v1/applications" | jq "$unwrap")
          if [ -z "$list" ]; then
            echo "Coolify no devolvio la lista de aplicaciones" >&2
            exit 1
          fi

          # El recurso de la API es el que no es el tablero: el contenedor que
          # lleva los CLI compilados en `dist`.
          uuid=$(printf '%s' "$list" \
            | jq -r '.[] | select((.name // "") | test("dashboard") | not) | .uuid' \
            | head -n 1)
          if [ -z "$uuid" ]; then
            echo "no hay ninguna aplicacion que no sea el tablero" >&2
            exit 1
          fi
          echo "recurso de la API: $uuid"

          command='node dist/database/cli/refresh-read-model-snapshots.js'

          response=$(api --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg command "$command" '{command: $command}')" \
            "http://100.101.207.88/api/v1/applications/$uuid/execute")

          printf '%s\n' "$response" | jq . 2>/dev/null || printf '%s\n' "$response"

          if printf '%s' "$response" | jq -e '.message // .error // empty' >/dev/null 2>&1; then
            echo
            echo "Coolify rechazo la ejecucion. Corre el CLI desde el servidor:" >&2
            echo "  docker exec <contenedor-api> node dist/database/cli/refresh-read-model-snapshots.js" >&2
            exit 1
          fi

      - name: Say which sections the report can serve now
        run: |
          # La prueba no es que el comando volviera, sino que las lecturas que
          # no terminaban ya terminan. `fallidos` es el numero a mirar: cuatro
          # antes de esto, y lo que quede despues es lo que sigue sin arreglarse.
          curl --silent --max-time 300 "http://100.101.207.88:3003/api/readers"             | jq '{base: .base.nombre, fallidos, sinLeer: [.lectores[] | select(.ok | not) | .name]}'

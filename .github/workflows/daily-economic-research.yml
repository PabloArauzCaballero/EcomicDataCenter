name: daily-economic-research

on:
  workflow_dispatch:
  schedule:
    # America/La_Paz is UTC-4 year-round: 06:30 local = 10:30 UTC.
    - cron: '30 10 * * *'

permissions:
  contents: read

concurrency:
  group: daily-economic-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ECONOMIC_API_BASE_URL: ${{ vars.ECONOMIC_API_BASE_URL }}
      ECONOMIC_STORAGE_BASE_URL: ${{ vars.ECONOMIC_STORAGE_BASE_URL }}
      ECONOMIC_STORAGE_REPOSITORY: ${{ vars.ECONOMIC_STORAGE_REPOSITORY }}
      ECONOMIC_SOURCE_ID: ${{ vars.ECONOMIC_SOURCE_ID }}
      ECONOMIC_AGENT_CODE: ${{ vars.ECONOMIC_AGENT_CODE }}
      ECONOMIC_PROMPT_VERSION: ${{ vars.ECONOMIC_PROMPT_VERSION }}
      ECONOMIC_SCHEMA_VERSION: ${{ vars.ECONOMIC_SCHEMA_VERSION }}
      ECONOMIC_TIMEZONE: ${{ vars.ECONOMIC_TIMEZONE }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'groq/compound' }}
      ECONOMIC_COLLECTOR_KEY: ${{ secrets.ECONOMIC_COLLECTOR_KEY }}
      ECONOMIC_STORAGE_TOKEN: ${{ secrets.ECONOMIC_STORAGE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Run daily collector
        run: yarn daily:collect
      - name: Publish execution report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-economic-report-${{ github.run_id }}
          path: artifacts/daily-economic-report.json
          if-no-files-found: warn
          retention-days: 30

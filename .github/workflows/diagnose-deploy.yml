name: diagnose-deploy

# Dice que le pasa al servidor cuando un despliegue deja de terminar.
#
# Por que existe. El 2026-09-09 los despliegues de este repositorio y del
# tablero pasaron de tardar dos minutos a tardar dos horas y fallar, mientras
# Coolify seguia declarando las dos aplicaciones `running:healthy` porque el
# contenedor viejo continuaba sirviendo. Nadie tiene SSH a esa maquina: el nodo
# no publica claves de host, asi que `tailscale ssh` no entra. Lo unico que se
# puede preguntar es la API de Coolify, y esto la pregunta.
#
# Que hace. Entra a la tailnet, mira la cola de despliegues del observatorio y
# le pide al contenedor de la API que diga cuanto disco le queda. No despliega,
# no migra y no escribe nada.
#
# Que NO imprime. Un log de construccion puede llevar variables de entorno, y
# esto va a un registro que ve cualquiera con acceso al repositorio. Todo lo que
# sale pasa antes por un filtro que tacha lo que tenga forma de credencial.
#
# Un aviso que costo una vuelta entera: la aplicacion de la API se elige por su
# nombre exacto. Elegir «la primera que no se llame dashboard» devuelve
# `atlas-erp-backend`, que es de otro proyecto y esta en el mismo Coolify.

on:
  push:
    paths:
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-deploy
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          args: --ssh=false

      - name: Ask the server what it is short of
        env:
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          set -u

          api() {
            curl --silent --show-error --max-time 120 \
                 --header "Authorization: Bearer $TOKEN" \
                 --header "Accept: application/json" \
                 "$@"
          }

          redact() {
            sed -E \
              -e 's#([a-zA-Z+]+://[^:/@[:space:]]+):[^@[:space:]]+@#\1:***@#g' \
              -e 's/((PASSWORD|SECRET|TOKEN|KEY|AUTHKEY|DSN|URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***/gI'
          }

          unwrap='if type == "array" then . elif type == "object" and (.data | type) == "array" then .data else empty end'

          api "http://100.101.207.88/api/v1/applications" > /tmp/apps.json

          backend=$(jq -r "$unwrap"' | .[] | select(.name == "economic-observatory-backend") | .uuid' /tmp/apps.json)
          frontend=$(jq -r "$unwrap"' | .[] | select(.name == "economic-observatory-frontend") | .uuid' /tmp/apps.json)

          echo "backend:  ${backend:-NO ENCONTRADO}"
          echo "frontend: ${frontend:-NO ENCONTRADO}"

          for uuid in $backend $frontend; do
            echo
            echo "=== ultimos intentos de $uuid ==="
            api "http://100.101.207.88/api/v1/deployments/applications/$uuid" \
              | jq -r '.deployments[0:4][] | "  \(.created_at)  \(.status)"'
          done

          if [ -z "$backend" ]; then
            echo "sin el recurso de la API no hay a quien preguntarle por el disco" >&2
            exit 1
          fi

          echo
          echo "=== espacio y memoria vistos desde el contenedor de la API ==="
          # `df` dentro del contenedor mira el mismo sistema de ficheros que usa
          # Docker para construir: si ahi no queda sitio, ninguna imagen nueva
          # termina y el despliegue se arrastra hasta que alguien lo mata.
          orden='df -h / /tmp 2>&1; echo; echo "--- memoria ---"; free -m 2>/dev/null || cat /proc/meminfo | head -4; echo; echo "--- carga ---"; cat /proc/loadavg'
          respuesta=$(api --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg command "$orden" '{command: $command}')" \
            "http://100.101.207.88/api/v1/applications/$backend/execute")

          printf '%s\n' "$respuesta" | jq -r '.message // .output // .' 2>/dev/null | redact \
            || printf '%s\n' "$respuesta" | redact

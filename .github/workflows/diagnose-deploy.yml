name: diagnose-deploy

# Dice por que Coolify no consigue levantar un contenedor nuevo.
#
# Por que existe. El 2026-09-09 seis despliegues seguidos —de este repositorio y
# del tablero— terminaron con «el contenedor nuevo no llego a servir». El
# webhook se acepta, el contenedor viejo sigue en pie, y Coolify declara las dos
# aplicaciones `running:healthy`. Desde fuera eso no distingue una construccion
# que muere a medias de una que nunca se encola, y son fallos opuestos.
#
# Que hace. Entra a la tailnet y le pregunta a Coolify por su cola de
# despliegues, por el commit que cree tener desplegado en cada aplicacion, y por
# el log del ultimo intento. No despliega, no migra y no escribe nada: solo lee.
#
# Que NO imprime. Un log de construccion puede llevar variables de entorno, y
# esto va a un registro que ve cualquiera con acceso al repositorio. Todo lo que
# sale pasa antes por un filtro que tacha lo que tenga forma de credencial.
#
# Se dispara al empujarlo, porque un `workflow_dispatch` solo se puede invocar
# por nombre si el fichero existe tambien en la rama por defecto, y esto es un
# diagnostico de una tarde, no una pieza del repositorio.

on:
  push:
    paths:
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-deploy
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          args: --ssh=false

      - name: Ask Coolify what it did with the deployment requests
        env:
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          set -u

          api() {
            curl --silent --show-error --max-time 120 \
                 --header "Authorization: Bearer $TOKEN" \
                 --header "Accept: application/json" \
                 "$@"
          }

          redact() {
            sed -E \
              -e 's#([a-zA-Z+]+://[^:/@[:space:]]+):[^@[:space:]]+@#\1:***@#g' \
              -e 's/((PASSWORD|SECRET|TOKEN|KEY|AUTHKEY|DSN|URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***/gI'
          }

          unwrap='if type == "array" then . elif type == "object" and (.data | type) == "array" then .data else empty end'

          echo "=== cola de despliegues de Coolify ==="
          api "http://100.101.207.88/api/v1/deployments" | jq . 2>/dev/null | head -c 5000 | redact
          echo

          api "http://100.101.207.88/api/v1/applications" \
            | jq -r "$unwrap"' | .[] | select((.name // "") | test("economic-observatory")) | .uuid' \
            > /tmp/uuids

          while read -r uuid; do
            [ -n "$uuid" ] || continue
            echo
            echo "=========================================================="
            echo "aplicacion $uuid"
            echo "=========================================================="

            echo "--- lo que Coolify cree tener desplegado ---"
            api "http://100.101.207.88/api/v1/applications/$uuid" \
              | jq '{name, status, git_branch, git_commit_sha, build_pack, ports_exposes, last_online_at, updated_at}' 2>/dev/null \
              | redact

            for path in "applications/$uuid/deployments" "deployments/applications/$uuid"; do
              echo "--- GET /api/v1/$path ---"
              api "http://100.101.207.88/api/v1/$path" | head -c 3000 | redact
              echo
            done
          done < /tmp/uuids

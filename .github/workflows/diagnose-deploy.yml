name: diagnose-deploy

# Dice por que Coolify no consigue levantar un contenedor nuevo.
#
# Por que existe. El 2026-09-09, seis despliegues seguidos —de este repositorio
# y del tablero— terminaron con «el contenedor nuevo no llego a servir». Coolify
# declara las dos aplicaciones `running:healthy` mientras sirven contenedores
# anteriores a todos esos intentos, asi que desde fuera no se distingue una
# construccion que muere de una que nunca se encola. Preguntando por la cola
# aparecio lo que importa: los despliegues que antes tardaban dos minutos
# empezaron a tardar dos horas y a fallar, y los dos ultimos fallaron en el
# mismo minuto. Falta el log, que es lo unico que nombra la causa.
#
# Que hace. Entra a la tailnet y pide a Coolify el log del ultimo despliegue de
# cada aplicacion del observatorio. No despliega, no migra y no escribe nada.
#
# Que NO imprime. Un log de construccion puede llevar variables de entorno, y
# esto va a un registro que ve cualquiera con acceso al repositorio. Todo lo que
# sale pasa antes por un filtro que tacha lo que tenga forma de credencial.
#
# Se dispara al empujarlo, porque un `workflow_dispatch` solo se puede invocar
# por nombre si el fichero existe tambien en la rama por defecto, y esto es un
# diagnostico de una tarde, no una pieza del repositorio.

on:
  push:
    paths:
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-deploy
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          args: --ssh=false

      - name: Read the log of the last deployment of each application
        env:
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          set -u

          api() {
            curl --silent --show-error --max-time 120 \
                 --header "Authorization: Bearer $TOKEN" \
                 --header "Accept: application/json" \
                 "$@"
          }

          redact() {
            sed -E \
              -e 's#([a-zA-Z+]+://[^:/@[:space:]]+):[^@[:space:]]+@#\1:***@#g' \
              -e 's/((PASSWORD|SECRET|TOKEN|KEY|AUTHKEY|DSN|URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***/gI'
          }

          unwrap='if type == "array" then . elif type == "object" and (.data | type) == "array" then .data else empty end'

          api "http://100.101.207.88/api/v1/applications" \
            | jq -r "$unwrap"' | .[] | select((.name // "") | test("economic-observatory")) | .uuid' \
            > /tmp/uuids

          while read -r uuid; do
            [ -n "$uuid" ] || continue

            api "http://100.101.207.88/api/v1/deployments/applications/$uuid" > /tmp/deployments.json || true

            name=$(jq -r '.deployments[0].application_name // "?"' /tmp/deployments.json)
            echo
            echo "=========================================================="
            echo "$name"
            echo "=========================================================="
            echo "--- los cinco ultimos intentos ---"
            jq -r '.deployments[0:5][] | "  \(.created_at)  \(.status)  \(.deployment_uuid)"' /tmp/deployments.json

            # El primero que no sea el que esta en cola ahora: el que fallo es
            # el que tiene algo que contar.
            jq -r '[.deployments[] | select(.status != "queued")][0].deployment_uuid // empty' /tmp/deployments.json \
              > /tmp/last
            last=$(cat /tmp/last)
            [ -n "$last" ] || continue

            echo
            echo "--- final del log de $last ---"
            api "http://100.101.207.88/api/v1/deployments/$last" > /tmp/one.json || true
            # Coolify guarda el log como una cadena JSON con una entrada por
            # linea; si no se deja leer asi, se imprime crudo antes que nada.
            jq -r '.logs // empty' /tmp/one.json \
              | jq -r '.[]? | "\(.output)"' 2>/dev/null \
              | tail -n 60 \
              | redact \
              || jq -r '.logs // .' /tmp/one.json | tail -c 4000 | redact
          done < /tmp/uuids

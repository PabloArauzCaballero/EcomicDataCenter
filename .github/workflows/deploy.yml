name: deploy-to-coolify

# Coolify corre en un servidor casero que no esta publicado en internet, asi que
# GitHub no puede alcanzarlo con un webhook normal. En vez de exponer su panel de
# administracion, el runner entra a la tailnet y llama a la API por la direccion
# privada del servidor. La red es la frontera: la API de Coolify nunca escucha
# fuera de ella.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  # Solo para abrir el issue `ingesta-caida` cuando el despliegue falla.
  issues: write

env:
  # La API publica aqui, sobre la interfaz de Tailscale. Es tambien la unica via
  # por la que este trabajo puede comprobar lo que desplego.
  API_URL: http://100.101.207.88:3002

# Un despliegue a la vez, y sin cancelar el que ya empezo: interrumpir a medias
# dejaria contenedores a medio recrear en el servidor.
concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  # Contabo (`test`, test.datosbolivia.com) no recibe nada del recolector: su
  # API solo escucha dentro del servidor. Sus datos entran por las semillas, y
  # daily-source-batches las publica solo en `dev`. Sin este trabajo `test` se
  # quedo una semana con las lecturas del 22 de septiembre de 2026. Corre aparte
  # del despliegue a pablo-h310 y no pasa por la tailnet: que ese servidor sea
  # inalcanzable no debe dejar a Contabo sin datos. El push a `test` lo recoge
  # el webhook de Coolify en Contabo.
  seeds-to-test:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test
          fetch-depth: 0

      - name: Carry the day's seeds from dev to test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898541+github-actions[bot]@users.noreply.github.com'
          seeds='src/database/seeds/boot/*.json'

          # Lo que cada semilla necesita para entrar: su sembrador, su esquema y
          # las piezas comunes. Si eso difiere entre ramas, el sembrador de
          # `test` podria no entender el archivo de `dev` y tumbar el arranque
          # de Contabo.
          shared='src/database/seeds/schemas/seed.primitives.ts src/database/seeds/schemas/seed.schemas.ts src/database/seeds/schemas/boot-seed.schemas.ts'

          for intento in 1 2 3; do
            git fetch --quiet origin dev test
            git reset --quiet --hard origin/test

            if ! git diff --quiet origin/test origin/dev -- $shared; then
              echo "::error::Los esquemas comunes de las semillas difieren entre test y dev; hay que llevar ese codigo a test antes que los datos."
              exit 1
            fi

            changed=""
            held=""
            for file in $(git diff --name-only origin/test origin/dev -- "$seeds"); do
              # `_registry.json`, `_state.json`... son la memoria del recolector,
              # no semillas: los sembradores los saltan (`!name.startsWith('_')`),
              # asi que no hay sembrador de `test` que deba entenderlos.
              case "$(basename "$file")" in _*) continue ;; esac

              # Un archivo suelto es su propia semilla; los de una carpeta
              # (bcb-statistics/, ine-trade/) los lee el sembrador de la carpeta.
              name=$(basename "$file" .json)
              folder=$(basename "$(dirname "$file")")
              if [ "$folder" != "boot" ]; then name="$folder"; fi
              code="src/database/seeds/runners/boot-seed.$name.ts src/database/seeds/schemas/$name.schema.ts"
              if ! git cat-file -e "origin/test:$file" 2>/dev/null; then
                held="$held $name(nueva)"
              elif ! git diff --quiet origin/test origin/dev -- $code; then
                held="$held $name(codigo)"
              else
                git show "origin/dev:$file" > "$file"
                changed="$changed $file"
              fi
            done

            if [ -n "$changed" ]; then
              git add $changed
              git commit --quiet -m 'Llevar a test las lecturas del dia'                 -m "Copiadas de dev ($(git rev-parse --short origin/dev)) por la ejecucion ${{ github.run_id }} de deploy-to-coolify."
              if ! git push --quiet origin HEAD:test; then
                echo "push rechazado (intento $intento): vuelvo a partir de test"
                continue
              fi
              echo "semillas publicadas en test:$changed"
            else
              echo "no hay semillas compatibles que llevar a test"
            fi

            # Lo retenido no se puede dejar en un aviso que nadie lee: Contabo
            # se quedaria sin esas series igual que antes. Rojo y al issue.
            if [ -n "$held" ]; then
              echo "::error::Semillas retenidas porque test no tiene su codigo:$held. Llevar ese codigo a test."
              exit 1
            fi
            exit 0
          done
          echo "::error::no se pudieron publicar las semillas en test tras tres intentos"
          exit 1

      - name: Report the failure where someone will see it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # El checkout es de `test`, que no tiene scripts/ops: el aviso sale de `dev`.
        run: git show origin/dev:scripts/ops/avisar-ingesta-caida.sh | bash -s -- "semillas a test (Contabo)"

  deploy:
    runs-on: ubuntu-24.04
    # Mas que los quince minutos que espera el ultimo paso: si el trabajo muere
    # antes que su propia espera, un despliegue lento se informa como si nunca
    # hubiera llegado.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      # Cada run deja un nodo `github-*` en la tailnet. Con una clave que no sea
      # efimera se quedan para siempre, y al llegar a mil Tailscale rechaza los
      # nuevos con «node quota reached»: asi estuvo cortada la ingesta del 25 al
      # 27 de septiembre de 2026. Se limpia antes de entrar, no despues, para
      # que un run que muere a medias no deje la limpieza sin hacer.
      - name: Clear dead CI nodes from the tailnet
        continue-on-error: true
        env:
          TS_API_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TS_API_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
          TS_JANITOR_OPTIONAL: '1'
        run: node scripts/ops/tailnet-janitor.mjs

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          # Tiene que ser una clave efimera: solo asi el `logout` del ultimo paso
          # borra el nodo. Una clave normal lo deja en la tailnet para siempre.
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          args: --ssh=false

      - name: Wait for the server to answer
        run: |
          for attempt in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s 100.101.207.88 >/dev/null 2>&1; then
              echo "servidor alcanzable"
              exit 0
            fi
            echo "intento $attempt: aun sin ruta, reintentando"
            sleep 3
          done
          # El paso anterior sale en verde aunque `tailscale up` falle, asi que
          # el motivo real solo esta en su log.
          echo "::error::no hay ruta al servidor por la tailnet. Si el paso 'Join the tailnet' dice «node quota reached», la tailnet esta llena de nodos de CI: correr tailnet-janitor."
          exit 1

      - name: Note the moment before deploying
        id: before
        run: |
          # Un despliegue que no cambia ninguna respuesta produce un cuerpo
          # identico, asi que nada en la respuesta distingue el contenedor nuevo
          # del que reemplazo. Lo que si los distingue es que el proceso
          # rearranca: una hora de arranque posterior a este instante solo puede
          # pertenecer al contenedor que este despliegue creo. Preguntarle a
          # Coolify seria mas directo, pero exige un token con permiso de lectura
          # y el que hay aqui solo puede disparar webhooks.
          echo "t0=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Trigger the deployment
        env:
          WEBHOOK: ${{ secrets.PABLO_H310_COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "faltan PABLO_H310_COOLIFY_WEBHOOK o PABLO_H310_COOLIFY_TOKEN" >&2
            exit 1
          fi
          # POST, no GET: Coolify movio este endpoint y responde 405 a un GET.
          # --fail-with-body para que un rechazo suyo se vea en el log en vez de
          # morir con un codigo de salida mudo.
          curl --fail-with-body --silent --show-error --max-time 60 \
               --request POST \
               --header "Authorization: Bearer $TOKEN" \
               --header "Accept: application/json" \
               --header "Content-Length: 0" \
               "$WEBHOOK"
          echo
          echo "despliegue solicitado a Coolify"

      - name: Wait for the new container to serve, and to reach the database
        env:
          T0: ${{ steps.before.outputs.t0 }}
        run: |
          # Disparar el webhook solo prueba que Coolify acepto la peticion. Lo
          # que hace falta saber es que el contenedor que quedo en pie es el que
          # este despliegue construyo, y que llego a abrir sus dos pools.
          deadline=$(( $(date +%s) + 900 ))
          arrived=""

          while [ "$(date +%s)" -lt "$deadline" ]; do
            reported=$(curl --silent --max-time 20 "${API_URL}/version" || true)
            started=$(printf '%s' "$reported" | jq -r '.startedAt // empty' 2>/dev/null || true)

            if [ -z "$started" ]; then
              # Hasta que este despliegue llegue, `/version` puede no existir: el
              # contenedor en pie fue construido antes de que la ruta existiera.
              echo "la API no reporta su arranque todavia"
            else
              startedEpoch=$(date -u -d "$started" +%s 2>/dev/null || echo 0)
              if [ "$startedEpoch" -gt "$T0" ]; then
                arrived="si"
                echo "contenedor nuevo en servicio (arranco $started)"
                break
              fi
              echo "sigue en pie el contenedor anterior (arranco $started)"
            fi
            sleep 15
          done

          if [ -z "$arrived" ]; then
            echo "el contenedor nuevo no llego a servir en quince minutos." >&2
            echo "Revisa el log del despliegue en Coolify." >&2
            exit 1
          fi

          # Un proceso que arranca no es una API que sirve: `/ready` es lo unico
          # que dice que el escritor y el lector abrieron contra PostgreSQL.
          ready=$(curl --silent --max-time 30 "${API_URL}/ready" || true)
          echo "$ready"
          if ! printf '%s' "$ready" | grep -q '"status":"ready"'; then
            echo "la API desplegada responde pero no alcanza la base." >&2
            echo "Revisa DATABASE_*_URL en el recurso de Coolify." >&2
            exit 1
          fi

          echo "la API desplegada responde y alcanza la base"

      - name: Report the failure where someone will see it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ops/avisar-ingesta-caida.sh "deploy-to-coolify (${{ github.ref_name }})"

      # Con una clave efimera esto borra el nodo en el acto; sin este paso tarda
      # entre treinta y sesenta minutos en desaparecer.
      - name: Leave the tailnet
        if: always()
        run: sudo tailscale logout || true
